services:
  # 1. Primary Relational + JSONB Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: uk-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uk_edistrict_db}
      POSTGRES_USER: ${DB_USER:-edistrict_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edistrict_secure_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edistrict_admin} -d ${DB_NAME:-uk_edistrict_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. In-Memory Session & Cache (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: uk-redis-cache
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-redis_secure_pass_2026}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 3. High-Performance S3-Compatible Object Store (MinIO)
  minio:
    image: minio/minio:latest
    container_name: uk-minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # 4. Production Web Application (Nginx + React Vite Bundle)
  voice-form-fillup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk-voice-form-fillup
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # 5. Development Service with Hot Module Replacement (HMR)
  voice-form-dev:
    image: node:20-alpine
    container_name: uk-voice-form-dev
    working_dir: /app
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
    profiles:
      - dev
    networks:
      - app-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  app-network:
    driver: bridge
