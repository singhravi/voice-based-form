services:
  # Production Service (Optimized Nginx + Vite Production Build)
  voice-form-fillup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk-voice-form-fillup
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # Development Service with Hot Module Replacement (HMR)
  voice-form-dev:
    image: node:20-alpine
    container_name: uk-voice-form-dev
    working_dir: /app
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development
    profiles:
      - dev
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
